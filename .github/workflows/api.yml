name: API

# Pull requests build only when the API or this workflow changes;
# every push to main builds.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pulsefit-api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pulsefit-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.13.1+2"

      - name: Verify Temurin runtime
        run: |
          version="$(java -version 2>&1)"
          printf '%s\n' "$version"
          grep -Fq 'Temurin-21.0.13.1+2' <<< "$version"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - run: ./gradlew build --stacktrace

      - name: Build Docker image
        run: docker build -t pulsefit-api .

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: pulsefit-api/build/reports/tests/
          retention-days: 7
